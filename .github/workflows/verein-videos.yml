#------------------------------------------------------------------------------
# Länge und Höhepunkt neuer Videos eines Vereins ermitteln - aufgerufen aus
# dem Repository des Vereins, meist jede Nacht (Vorlage:
# vorlage-verein/.github/workflows/notenarchiv-videos.yml).
#
# Liest für jedes Video im Katalog ohne Länge die YouTube-Seite und trägt
# Länge und Höhepunkt in die Firebase-Datenbank des Vereins ein. Braucht das
# Secret ADMIN_PASSWORD (Passwort des Verwaltungskontos); ohne wird nichts
# gemacht.
#------------------------------------------------------------------------------
name: Video-Details

on:
  workflow_call:
    inputs:
      app-repository:
        description: "Repository des Notenarchivs, z. B. konto/notenarchiv-app"
        type: string
        required: true
      version:
        description: "Version des Notenarchivs, z. B. v1.0.0"
        type: string
        required: true
    secrets:
      ADMIN_PASSWORD:
        required: false

jobs:
  details:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Kein Secret
        if: env.ADMIN_PASSWORD == ''
        run: echo "::notice::Secret ADMIN_PASSWORD fehlt - nichts zu tun (siehe docs/verwaltung.md)."

      - name: Notenarchiv holen
        if: env.ADMIN_PASSWORD != ''
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.app-repository }}
          ref: ${{ inputs.version }}
          path: app

      - name: Vereinsordner holen
        if: env.ADMIN_PASSWORD != ''
        uses: actions/checkout@v7
        with:
          path: club

      - name: Vereinsordner einsetzen
        if: env.ADMIN_PASSWORD != ''
        run: cp -r club/verein/. app/website/verein/

      - name: Set up Node.js
        if: env.ADMIN_PASSWORD != ''
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/website/package-lock.json

      - name: Install dependencies
        if: env.ADMIN_PASSWORD != ''
        working-directory: app/website
        run: npm ci

      - name: Videos auswerten
        if: env.ADMIN_PASSWORD != ''
        working-directory: app/website
        run: npm run catalog:details
