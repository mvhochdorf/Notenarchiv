#------------------------------------------------------------------------------
# Prüfen und veröffentlichen: Lint, Formatierung, Typen, Tests und Build bei
# jedem Push auf main. Steht danach in website/package.json
# eine Version, zu der es noch keinen Tag gibt, wird sie veröffentlicht:
# Tag v<Version> und ein GitHub-Release mit dem Abschnitt aus CHANGELOG.md.
#
# Eine Seite veröffentlicht dieses Repository nicht - das machen die
# Vereins-Repositorys mit verein-seite.yml (siehe docs/neuer-verein.md).
#------------------------------------------------------------------------------
name: Prüfen und veröffentlichen

permissions:
  contents: read

on:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./website
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build (Beispielverein)
        run: npm run build

  release:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Tag und Release anlegen.
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Version lesen
        id: version
        run: |
          version=$(node -p "require('./website/package.json').version")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version gibt es schon - nichts zu veröffentlichen."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Text aus dem CHANGELOG
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Der Abschnitt "## <Version>" bis zum nächsten "## ".
          awk -v v="## $VERSION" '
            $0 == v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::Kein Abschnitt \"## $VERSION\" in CHANGELOG.md."
            echo "Siehe CHANGELOG.md." > notes.md
          fi

      - name: Tag und Release anlegen
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG"             --target "$GITHUB_SHA"             --title "Notenarchiv $TAG"             --notes-file notes.md
