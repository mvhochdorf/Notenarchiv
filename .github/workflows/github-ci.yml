#------------------------------------------------------------------------------
# Prüfen: Lint, Formatierung, Typen, Tests und Build bei jedem Push auf
# main. Dieses Repository veröffentlicht selbst keine Seite - das
# machen die Vereins-Repositorys mit verein-seite.yml (siehe
# docs/neuer-verein.md).
#------------------------------------------------------------------------------
name: Prüfen

permissions:
  contents: read

on:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./website
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build (Beispielverein)
        run: npm run build
